<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Syntax-prime | Mantenimiento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #0b2a55 0%, #050914 45%, #020409 100%);
      color: white;
      overflow: hidden;
    }

    /* Luces de fondo */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: #007bff;
      filter: blur(130px);
      opacity: 0.18;
      animation: float 6s infinite alternate ease-in-out;
    }

    body::before {
      top: -100px;
      left: -100px;
    }

    body::after {
      bottom: -120px;
      right: -100px;
      animation-delay: 2s;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 650px;
      padding: 55px 35px;
      text-align: center;

      background: rgba(10, 18, 35, 0.75);
      border: 1px solid rgba(0, 140, 255, 0.35);
      border-radius: 25px;

      box-shadow:
        0 0 40px rgba(0, 123, 255, 0.15),
        inset 0 0 30px rgba(0, 123, 255, 0.04);

      backdrop-filter: blur(15px);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
      animation: rotate 4s linear infinite;
      filter: drop-shadow(0 0 15px #008cff);
    }

    h1 {
      font-size: clamp(35px, 7vw, 65px);
      color: #1597ff;
      margin-bottom: 12px;
      text-shadow:
        0 0 10px rgba(0, 140, 255, 0.8),
        0 0 30px rgba(0, 140, 255, 0.4);
    }

    .maintenance {
      font-size: 24px;
      font-weight: bold;
      color: white;
      margin-bottom: 15px;
    }

    .description {
      color: #9fb3c8;
      font-size: 16px;
      line-height: 1.6;
      max-width: 500px;
      margin: auto;
    }

    .line {
      width: 100px;
      height: 4px;
      background: #008cff;
      border-radius: 10px;
      margin: 25px auto;
      box-shadow: 0 0 15px #008cff;
      animation: pulse 1.5s infinite;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 25px;
      padding: 10px 18px;
      border-radius: 50px;
      background: rgba(0, 123, 255, 0.1);
      border: 1px solid rgba(0, 140, 255, 0.3);
      color: #55b5ff;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #008cff;
      border-radius: 50%;
      box-shadow: 0 0 10px #008cff;
      animation: blink 1s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scaleX(1);
        opacity: 1;
      }
      50% {
        transform: scaleX(1.4);
        opacity: 0.5;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0.3;
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(40px);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 40px 20px;
      }

      .icon {
        font-size: 50px;
      }

      .maintenance {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">⚙️</div>

    <h1>Syntax-prime</h1>

    <div class="line"></div>

    <div class="maintenance">
      En mantenimiento
    </div>

    <p class="description">
      Estamos realizando algunas mejoras para ofrecerte
      una experiencia más rápida, estable y moderna.
      <br>
      Volveremos pronto.
    </p>

    <div class="status">
      <span class="dot"></span>
      Mantenimiento en curso
    </div>

  </div>

</body>
</html>
