<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Cine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Inter', sans-serif;
            background: #060b18;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(0,119,182,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0,180,216,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(56,189,248,0.04) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,180,216,0.3); }
            50% { box-shadow: 0 0 40px rgba(0,180,216,0.6); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: rgba(6,11,24,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,180,216,0.15);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s ease;
        }

        .logo {
            font-size: 2em;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00b4d8, #0ea5e9, #38bdf8, #00b4d8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite;
            cursor: default;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            padding: 12px 22px;
            border: 1px solid rgba(0,180,216,0.2);
            border-radius: 50px;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 0.95em;
            font-family: 'Inter', sans-serif;
            width: 320px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box input::placeholder { color: #475569; }
        .search-box input:focus {
            border-color: #00b4d8;
            background: rgba(15,23,42,0.8);
            box-shadow: 0 0 30px rgba(0,180,216,0.15);
        }

        .search-box button {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            font-size: 0.95em;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .search-box button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .search-box button:hover::before { left: 100%; }
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,180,216,0.4);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            padding: 16px 40px;
            background: rgba(6,11,24,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-tabs button {
            padding: 10px 24px;
            border: 1px solid rgba(0,180,216,0.15);
            border-radius: 50px;
            background: rgba(15,23,42,0.4);
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            font-size: 0.88em;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .nav-tabs button.active {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(0,180,216,0.3);
        }

        .nav-tabs button:hover:not(.active) {
            background: rgba(0,180,216,0.1);
            color: #94a3b8;
            border-color: rgba(0,180,216,0.3);
        }

        #movies-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            padding: 30px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .movie-card {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .movie-card:nth-child(1) { animation-delay: 0.05s; }
        .movie-card:nth-child(2) { animation-delay: 0.1s; }
        .movie-card:nth-child(3) { animation-delay: 0.15s; }
        .movie-card:nth-child(4) { animation-delay: 0.2s; }
        .movie-card:nth-child(5) { animation-delay: 0.25s; }
        .movie-card:nth-child(6) { animation-delay: 0.3s; }
        .movie-card:nth-child(7) { animation-delay: 0.35s; }
        .movie-card:nth-child(8) { animation-delay: 0.4s; }

        .movie-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(0,180,216,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,180,216,0.15);
        }

        .movie-card .poster-wrap {
            position: relative;
            overflow: hidden;
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .movie-card:hover img { transform: scale(1.08); }

        .movie-card .poster-wrap::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: linear-gradient(to top, rgba(15,23,42,0.95), transparent);
            pointer-events: none;
        }

        .movie-card .play-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 56px; height: 56px;
            background: rgba(0,180,216,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .movie-card .play-icon::after {
            content: '';
            width: 0; height: 0;
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #fff;
            margin-left: 4px;
        }

        .movie-card:hover .play-icon { transform: translate(-50%, -50%) scale(1); }

        .badge {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(0,119,182,0.9);
            backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .movie-card .info {
            padding: 16px;
        }

        .movie-card .title {
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }

        .movie-card .meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82em;
        }

        .movie-card .rating {
            color: #fbbf24;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .movie-card .year {
            color: #64748b;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-overlay.active { display: flex; }

        .modal {
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,180,216,0.15);
            border-radius: 24px;
            width: 92%;
            max-width: 950px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            scrollbar-width: thin;
            scrollbar-color: #1e3a5f transparent;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-track { background: transparent; }
        .modal::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            font-size: 1.4em;
            color: #94a3b8;
            cursor: pointer;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(239,68,68,0.8);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-backdrop {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 24px 24px 0 0;
        }

        .modal-content {
            padding: 28px 32px;
        }

        .modal-content h2 {
            font-size: 1.8em;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            color: #64748b;
            flex-wrap: wrap;
            font-size: 0.95em;
        }

        .modal-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-description {
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 28px;
            font-size: 0.95em;
        }

        .genre-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .genre-tag {
            background: rgba(0,180,216,0.1);
            border: 1px solid rgba(0,180,216,0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            color: #38bdf8;
            font-weight: 500;
        }

        .servers-section { margin-top: 24px; }

        .servers-section h3 {
            color: #00b4d8;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 700;
        }

        .server-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .server-tabs button {
            padding: 10px 20px;
            border: 1px solid rgba(0,180,216,0.15);
            border-radius: 12px;
            background: rgba(15,23,42,0.6);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.88em;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .server-tabs button.active {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0,180,216,0.3);
        }

        .server-tabs button:hover:not(.active) {
            background: rgba(0,180,216,0.1);
            color: #e2e8f0;
            border-color: rgba(0,180,216,0.3);
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            text-align: center;
            padding: 80px 40px;
            color: #00b4d8;
            font-size: 1.1em;
            grid-column: 1 / -1;
        }

        .spinner {
            border: 3px solid rgba(0,180,216,0.15);
            border-top-color: #00b4d8;
            border-radius: 50%;
            width: 44px; height: 44px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #no-results {
            text-align: center;
            padding: 80px 40px;
            color: #475569;
            font-size: 1.1em;
            display: none;
            grid-column: 1 / -1;
        }

        #load-more-container {
            text-align: center;
            padding: 10px 40px 40px;
            display: none;
        }

        #load-more-btn {
            padding: 14px 44px;
            border: 1px solid rgba(0,180,216,0.3);
            border-radius: 50px;
            background: rgba(0,119,182,0.2);
            backdrop-filter: blur(10px);
            color: #00b4d8;
            font-size: 1em;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        #load-more-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,180,216,0.2), transparent);
            transition: left 0.5s;
        }

        #load-more-btn:hover::before { left: 100%; }
        #load-more-btn:hover {
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,180,216,0.3);
        }

        /* Blocked overlay */
        .block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .block-overlay.active { display: flex; }

        .block-overlay .icon { font-size: 4em; }
        .block-overlay .msg { color: #ef4444; font-size: 1.3em; font-weight: 600; }
        .block-overlay .sub { color: #64748b; font-size: 0.9em; }

        @media (max-width: 768px) {
            header { padding: 14px 16px; flex-wrap: wrap; gap: 12px; }
            .search-box input { width: 100%; }
            .nav-tabs { padding: 12px 16px; }
            #movies-container { padding: 16px; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .movie-card img { height: 210px; }
            .modal { width: 96%; border-radius: 16px; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="block-overlay" id="block-overlay">
        <div class="icon">⛔</div>
        <div class="msg">Acceso denegado</div>
        <div class="sub">Las herramientas de desarrollo están deshabilitadas</div>
    </div>

    <header>
        <div class="logo">⚡ SYNTAX</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar películas...">
            <button onclick="searchMovies()">Buscar</button>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="active" onclick="loadCategory('popular', this)">🔥 Populares</button>
        <button onclick="loadCategory('now_playing', this)">🎬 En Cartelera</button>
        <button onclick="loadCategory('upcoming', this)">📅 Próximamente</button>
        <button onclick="loadCategory('top_rated', this)">⭐ Mejor Valoradas</button>
        <button onclick="loadCategory('latest', this)">🆕 Últimas</button>
    </div>

    <div id="movies-container"></div>
    <div id="no-results">No se encontraron resultados</div>
    <div id="load-more-container">
        <button id="load-more-btn" onclick="loadMoreMovies()">Cargar más películas</button>
    </div>

    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">

            <img class="modal-backdrop" id="modal-backdrop" src="" alt="">

                <h2 id="modal-title"></h2>
                <div class="modal-meta">
                    <span id="modal-year"></span>
                    <span id="modal-rating"></span>
                    <span id="modal-runtime"></span>
                </div>
                <div class="genre-tags" id="modal-genres"></div>
                <p class="modal-description" id="modal-desc"></p>
                <div class="servers-section">
                    <h3>▶ Selecciona servidor</h3>
                    <div class="server-tabs" id="server-tabs"></div>
                    <div class="player-container" id="player-container">
                        <p style="color:#475569;padding:60px;text-align:center;">Selecciona un servidor para reproducir</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════
        //  SEGURIDAD - Anti-inspección
        // ═══════════════════════════════════════════
        (function() {
            // Bloquear clic derecho
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Bloquear teclas de dev tools
            document.addEventListener('keydown', function(e) {
                // F12
                if (e.key === 'F12' || e.keyCode === 123) {
                    e.preventDefault();
                    showBlock();
                    return false;
                }
                // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    showBlock();
                    return false;
                }
                // Ctrl+U (ver fuente)
                if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    showBlock();
                    return false;
                }
                // Ctrl+S (guardar)
                if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }
            });

            // Bloquear arrastre de imágenes
            document.addEventListener('dragstart', e => e.preventDefault());

            // Detectar DevTools abierto
            let devToolsOpen = false;
            const threshold = 160;

            setInterval(function() {
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                if (widthThreshold || heightThreshold) {
                    if (!devToolsOpen) {
                        devToolsOpen = true;
                        showBlock();
                    }
                } else {
                    devToolsOpen = false;
                }
            }, 1000);

            function showBlock() {
                document.getElementById('block-overlay').classList.add('active');
                setTimeout(() => {
                    document.getElementById('block-overlay').classList.remove('active');
                }, 2000);
            }
        })();

        // ═══════════════════════════════════════════

        function _0xc(arr) { return arr.map(b => String.fromCharCode(b)).join(''); }
        const API_KEY = _0xc(_0xb);
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentMovie = null;

        let currentPage = 1;
        let allMovies = [];

        const servers = [
            { name: 'VidLux ★', url: id => `https://vidlux.xyz/embed/movie/${id}` },
            { name: 'UmPlay', url: id => `https://unlimplay.com/play/embed/movie/${id}` },

            { name: 'VidSrc CC', url: id => `https://vidsrc.cc/v3/embed/movie/${id}` },
            { name: 'VidLink', url: id => `https://vidlink.pro/movie/${id}` },
            { name: 'EmbedMaster', url: id => `https://embedmaster.link/movie/${id}` },
            { name: 'YapGrid', url: id => `https://yapgrid.com/embed/movie/${id}` },
            { name: 'EZVid', url: id => `https://ezvidapi.com/embed/movie/${id}` }
        ];

        // ═══════════════════════════════════════════
        //  PELÍCULAS
        // ═══════════════════════════════════════════
        async function fetchMovies(category = 'popular', page = 1, append = false) {
            const container = document.getElementById('movies-container');
            if (!append) {
                container.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando películas...</div>';
                allMovies = [];
            }

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${category}?api_key=${API_KEY}&language=es-ES&page=${page}`);
                const data = await res.json();

                if (append) {
                    allMovies = [...allMovies, ...data.results];
                } else {
                    allMovies = data.results;
                }

                renderMovies(allMovies);

                const lmc = document.getElementById('load-more-container');
                lmc.style.display = (data.page < data.total_pages) ? 'block' : 'none';
            } catch (err) {
                container.innerHTML = '<div class="loading">Error al cargar películas</div>';
            }
        }

        function loadMoreMovies() {
            currentPage++;
            fetchMovies(currentCategory, currentPage, true);
        }

        function renderMovies(movies) {
            const container = document.getElementById('movies-container');
            const noResults = document.getElementById('no-results');

            if (!movies || movies.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = movies.map((m, i) => `
                <div class="movie-card" onclick="openMovie(${m.id})" style="animation-delay:${i * 0.04}s">
                    <div class="poster-wrap">
                        <img src="${m.poster_path ? IMG_URL + m.poster_path : 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22><rect fill=%22%23111827%22 width=%22300%22 height=%22450%22/><text fill=%22%23475569%22 font-family=%22sans-serif%22 font-size=%2216%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22>Sin Imagen</text></svg>'}" alt="${m.title}" loading="lazy">
                        <div class="play-icon"></div>
                        <span class="badge">⭐ ${m.vote_average?.toFixed(1) || 'N/A'}</span>
                    </div>
                    <div class="info">
                        <div class="title">${m.title}</div>
                        <div class="meta">
                            <span class="rating">★ ${m.vote_average?.toFixed(1)}</span>
                            <span class="year">${m.release_date?.substring(0, 4) || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const container = document.getElementById('movies-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Buscando...</div>';
            document.getElementById('load-more-container').style.display = 'none';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=es-ES&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                allMovies = data.results;
                renderMovies(data.results);
            } catch (err) {
                container.innerHTML = '<div class="loading">Error en la búsqueda</div>';
            }
        }

        function loadCategory(category, btn) {
            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;
            currentPage = 1;
            fetchMovies(category, 1, false);
        }

        async function openMovie(id) {
            const modal = document.getElementById('modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=es-ES`);
                const movie = await res.json();
                currentMovie = movie;

                document.getElementById('modal-backdrop').src = movie.backdrop_path
                    ? `https://image.tmdb.org/t/p/original${movie.backdrop_path}`
                    : IMG_URL + (movie.poster_path || '');

                document.getElementById('modal-title').textContent = movie.title;
                document.getElementById('modal-year').textContent = `📅 ${movie.release_date?.substring(0, 4) || 'N/A'}`;
                document.getElementById('modal-rating').textContent = `⭐ ${movie.vote_average?.toFixed(1)}`;
                document.getElementById('modal-runtime').textContent = `⏱ ${movie.runtime || 'N/A'} min`;
                document.getElementById('modal-desc').textContent = movie.overview || 'Sin descripción disponible.';
                document.getElementById('modal-genres').innerHTML = (movie.genres || [])
                    .map(g => `<span class="genre-tag">${g.name}</span>`).join('');

                renderServerTabs(movie.id);
            } catch (err) {
                console.error(err);
            }
        }

        function renderServerTabs(movieId) {
            const tabs = document.getElementById('server-tabs');
            tabs.innerHTML = servers.map((s, i) => `
                <button onclick="loadServer(${movieId}, ${i}, this)" ${i === 0 ? 'class="active"' : ''}>${s.name}</button>
            `).join('');
            loadServer(movieId, 0, tabs.children[0]);
        }

        function loadServer(movieId, serverIndex, btn) {
            document.querySelectorAll('.server-tabs button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const container = document.getElementById('player-container');
            const url = servers[serverIndex].url(movieId);
            container.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="no-referrer-when-downgrade" style="width:100%;height:100%;border:none;"></iframe>`;
        }

        function closeModal(e) {
            if (e.target === document.getElementById('modal')) closeModalForce();
        }

        function closeModalForce() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('player-container').innerHTML = '<p style="color:#475569;padding:60px;text-align:center;">Selecciona un servidor para reproducir</p>';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchMovies();
        });

        fetchMovies('popular');
    </script>
</body>
</html>
